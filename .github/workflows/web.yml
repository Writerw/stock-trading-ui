name: Web Preview (Cloudflare)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate platform files
        run: |
          cp -r lib lib_backup
          cp pubspec.yaml pubspec_backup.yaml

          flutter create --project-name stock_app --org com.practice --platforms=web .

          rm -rf lib
          cp -r lib_backup lib
          cp pubspec_backup.yaml pubspec.yaml
          rm -rf lib_backup pubspec_backup.yaml

      - name: Get dependencies
        run: flutter pub get

      # --pwa-strategy=none disables the service worker (the main cause of
      # stale Flutter web pages), so the browser never serves an old build.
      - name: Build Web
        run: flutter build web --release --base-href "/" --pwa-strategy=none

      # Tell Cloudflare/browsers to always revalidate (no stale cache while testing)
      - name: Add no-cache headers
        run: |
          cat > build/web/_headers <<'EOF'
          /*
            Cache-Control: no-cache, max-age=0, must-revalidate
          EOF

      # Unregister any lingering old service worker so stale builds can't be served
      - name: Inject service-worker killer
        run: |
          sed -i 's#</body>#<script>if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){var had=false;rs.forEach(function(r){had=true;r.unregister();});if(had){location.reload();}});}</script></body>#' build/web/index.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d07a2e69bd77a2f9455d4607c799af07
          command: pages deploy build/web --project-name=stock-trading-ui --branch=main --commit-dirty=true
