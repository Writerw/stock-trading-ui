name: Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate platform files
        run: |
          cp -r lib lib_backup
          cp pubspec.yaml pubspec_backup.yaml

          flutter create --project-name stock_app --org com.practice .

          rm -rf lib
          cp -r lib_backup lib
          cp pubspec_backup.yaml pubspec.yaml
          rm -rf lib_backup pubspec_backup.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href "/stock-trading-ui/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
