name: Render screens

# Renders every screen at reference-phone metrics and pushes the PNGs (plus
# analyzer/test logs) to the `renders` branch. Runs when the commit message
# contains "[render]", or manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[render]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Provide Material icons font to tests
        run: |
          mkdir -p test/fonts
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" test/fonts/ || true

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos 2>&1 | tee analyze.log

      - name: Render
        continue-on-error: true
        run: flutter test --update-goldens test/render_test.dart 2>&1 | tee test.log

      - name: Publish renders branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/out
          cp test/renders/*.png /tmp/out/ 2>/dev/null || true
          cp analyze.log test.log /tmp/out/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/out/SHA
          cd /tmp/out
          git init -q
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git checkout -q -b renders
          git add -A
          git commit -q -m "renders for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" renders
