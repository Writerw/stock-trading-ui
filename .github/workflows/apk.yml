name: Build APK

# Runs when a pushed commit message contains "[apk]", or manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate platform files
        run: |
          cp -r lib lib_backup
          cp pubspec.yaml pubspec_backup.yaml

          flutter create --project-name stock_app --org com.practice --platforms=android .

          rm -rf lib
          cp -r lib_backup lib
          cp pubspec_backup.yaml pubspec.yaml
          rm -rf lib_backup pubspec_backup.yaml

      # Release builds have no INTERNET permission by default; google_fonts
      # downloads Inter at runtime, so without this the APK falls back to the
      # wrong font. Also give the app a readable name on the home screen.
      - name: Configure Android manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="stock_app"#android:label="Stock App"#' $M
          cat $M

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Create release with APK
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-release.apk stock-app.apk
          gh release create latest stock-app.apk \
            --title "Stock App - Latest Build" \
            --notes "Direct APK download. Tap stock-app.apk below to install on Android." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
