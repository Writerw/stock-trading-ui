name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate platform files
        run: |
          # Save our custom source files
          cp -r lib lib_backup
          cp pubspec.yaml pubspec_backup.yaml

          # Generate full Flutter project structure (android/, etc.)
          flutter create --project-name stock_app --org com.practice .

          # Restore our custom files over the generated defaults
          rm -rf lib
          cp -r lib_backup lib
          cp pubspec_backup.yaml pubspec.yaml
          rm -rf lib_backup pubspec_backup.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Delete old release
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release with APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk stock-app.apk
          gh release create latest stock-app.apk \
            --title "Stock App - Latest Build" \
            --notes "Direct APK download. Tap the link below to install on Android." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
